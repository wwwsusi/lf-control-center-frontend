<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Lady Fitness — CRM</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/crm.css"><link rel="stylesheet" href="/crm-control-center.css"></head>
<body><div class="home-shell"><header class="home-header"><a class="brand" href="/" aria-label="Lady Fitness — úvod"><img src="/assets/lady-fitness-logo.png" alt="Lady Fitness" width="240" height="112"></a><div class="crm-header-right"><span class="header-label">CRM</span><div id="crm-session" class="crm-session-bar" hidden><span id="crm-identity" class="crm-identity"></span><span class="crm-idle" title="Po 15 minútach nečinnosti ťa CRM automaticky odhlási. Kliknutie alebo stlačenie klávesu odpočet obnoví."><span class="crm-idle-label">Odhlásenie o</span> <span id="crm-idle-timer" class="crm-idle-timer" role="timer" aria-label="Čas do automatického odhlásenia pri nečinnosti" data-state="ok">15:00</span></span><button id="crm-logout" type="button">Odhlásiť sa</button><button id="crm-hide" type="button">Skryť údaje</button></div><button id="crm-refresh" type="button">Obnoviť prístup</button><a class="crm-back" href="/">← Späť na úvod</a></div></header>
<main class="crm-main" id="main-content"><p class="eyebrow">LADY FITNESS / CRM</p><h1 id="crm-heading">CRM · individuálne prihlásenie</h1><p id="crm-status" class="crm-status" role="status">CRM prístup sa overuje.</p>
<form id="crm-login" class="crm-login"><label>E-mail<input id="crm-email" name="email" type="email" maxlength="320" autocomplete="username" required></label><label>Heslo<input id="crm-password" name="password" type="password" maxlength="1024" autocomplete="current-password" required></label><label>Overovací kód z aplikácie (ak je zapnuté MFA)<input id="crm-mfa" name="mfa_code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6"></label><button id="crm-login-submit" type="submit">Prihlásiť sa</button><div class="crm-pin"><button id="crm-pin-open" type="button" aria-expanded="false" aria-controls="crm-pin-pad">Recepcia · prihlásiť PIN-om</button><div id="crm-pin-pad" hidden><p id="crm-pin-dots" class="crm-pin-dots" role="status" aria-live="polite" aria-label="Zadaný PIN">○○○○○○</p><div id="crm-pin-keys" class="crm-pin-keys"></div></div></div></form>
<div id="crm-access-actions"><button id="crm-first-access" type="button">Prvý prístup</button> <button id="crm-recovery" type="button">Zabudnuté heslo</button></div><section id="crm-access" hidden aria-label="Nastavenie prístupu"></section>
<section id="crm-workspace" hidden><div class="crm-toolbar"><nav class="crm-nav" aria-label="CRM"><button data-view="reception" aria-current="page">Recepcia</button><button data-view="today">Dnešné záznamy</button><button data-view="tasks" hidden>Úlohy</button><button data-view="reporting">Reporting</button><button data-view="privacy" hidden>Ochrana údajov</button><button data-view="staff" hidden>Správa prístupov</button></nav></div><div id="crm-content"></div></section>
<noscript><p>CRM vyžaduje JavaScript. Bez neho sa údaje nenačítajú.</p></noscript></main><footer><span>LADY FITNESS</span><span>CRM · Recepcia</span></footer></div><script type="module" src="/crm.mjs?v=20261109-reception-pin"></script></body></html>
