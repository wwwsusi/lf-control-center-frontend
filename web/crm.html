<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Lady Fitness — CRM</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/crm.css"></head>
<body><div class="home-shell"><header class="home-header"><a class="brand" href="/" aria-label="Lady Fitness — úvod"><img src="/assets/lady-fitness-logo.png" alt="Lady Fitness" width="240" height="112"></a><span class="header-label">CRM</span></header>
<main class="crm-main" id="main-content"><p class="eyebrow">LADY FITNESS / CRM</p><h1 id="crm-heading">CRM · individuálne prihlásenie</h1><p id="crm-status" class="crm-status" role="status">CRM prístup sa overuje.</p>
<form id="crm-login" class="crm-login"><label>E-mail<input id="crm-email" name="email" type="email" maxlength="320" autocomplete="username" required></label><label>Heslo<input id="crm-password" name="password" type="password" maxlength="1024" autocomplete="current-password" required></label><label>Overovací kód z autentifikátora<input id="crm-mfa-code" name="mfa_code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" aria-describedby="crm-mfa-note"></label><p id="crm-mfa-note">Majiteľka zadá aj aktuálny šesťmiestny kód. Recepcia ho zadáva iba ak jej účet vyžaduje MFA. Použi existujúci overený autentifikátor.</p><button id="crm-login-submit" type="submit">Prihlásiť sa</button></form>
<section id="crm-workspace" hidden><div class="crm-session"><span id="crm-identity"></span><button id="crm-logout" type="button">Odhlásiť sa</button><button id="crm-hide" type="button">Skryť údaje</button></div><nav aria-label="CRM"><button data-view="reception" aria-current="page">Recepcia</button><button data-view="today">Dnešné záznamy</button><button data-view="reporting">Reporting</button><button data-view="staff" hidden>Správa prístupov</button></nav><div id="crm-content"></div></section>
<button id="crm-refresh" type="button">Obnoviť prístup</button> <a class="crm-back" href="/">← Späť na úvod</a><noscript><p>CRM vyžaduje JavaScript. Bez neho sa údaje nenačítajú.</p></noscript></main><footer><span>LADY FITNESS</span><span>CRM · Recepcia</span></footer></div><script type="module" src="/crm.mjs"></script></body></html>
